<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试页面</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
    .dark body { background: #1a1a1a; color: white; }
    .light body { background: white; color: black; }
    
    #menu-btn {
      display: block;
      background: #f97316;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      margin: 20px 0;
    }
    
    #mobile-menu {
      display: none;
      background: white;
      border-radius: 12px;
      padding: 1rem;
      margin-top: 1rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    
    #mobile-menu a {
      display: block;
      padding: 12px;
      margin-bottom: 8px;
      background: #f3f4f6;
      border-radius: 8px;
      text-decoration: none;
      color: #1f2937;
      text-align: center;
    }
    
    #mobile-menu a:last-child { margin-bottom: 0; }
    
    .dark #mobile-menu {
      background: #374151;
    }
    
    .dark #mobile-menu a {
      background: #4b5563;
      color: white;
    }
    
    #theme-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      margin: 20px 0;
    }
    
    .info { background: #dbeafe; padding: 15px; border-radius: 8px; margin: 20px 0; }
    .dark .info { background: #1e3a5f; }
  </style>
</head>
<body>
  <h1>🔧 功能测试页面</h1>
  
  <div class="info">
    <p>点击下面的按钮测试功能是否正常工作</p>
  </div>
  
  <h2>1. 移动菜单测试</h2>
  <button id="menu-btn">☰ 点击显示菜单</button>
  
  <div id="mobile-menu">
    <a href="/">首页</a>
    <a href="/blog.html">分享</a>
    <a href="/links.html">交友</a>
    <a href="/about.html">关于</a>
  </div>
  
  <h2>2. 主题切换测试</h2>
  <button id="theme-btn">🌙 切换主题</button>
  
  <div class="info">
    <p id="status">当前状态：菜单关闭，暗色模式</p>
  </div>

  <script>
    console.log('JavaScript 开始执行');
    
    // 获取元素
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const themeBtn = document.getElementById('theme-btn');
    const status = document.getElementById('status');
    const html = document.documentElement;
    
    let menuOpen = false;
    let isDark = true;
    
    // 检查元素是否存在
    console.log('menuBtn:', menuBtn);
    console.log('mobileMenu:', mobileMenu);
    console.log('themeBtn:', themeBtn);
    
    // 菜单按钮点击事件
    if (menuBtn) {
      menuBtn.onclick = function() {
        console.log('菜单按钮被点击');
        menuOpen = !menuOpen;
        if (menuOpen) {
          mobileMenu.style.display = 'block';
          menuBtn.textContent = '✕ 点击隐藏菜单';
          status.textContent = '当前状态：菜单打开，' + (isDark ? '暗色模式' : '亮色模式');
        } else {
          mobileMenu.style.display = 'none';
          menuBtn.textContent = '☰ 点击显示菜单';
          status.textContent = '当前状态：菜单关闭，' + (isDark ? '暗色模式' : '亮色模式');
        }
      };
    } else {
      console.error('未找到菜单按钮');
    }
    
    // 主题按钮点击事件
    if (themeBtn) {
      themeBtn.onclick = function() {
        console.log('主题按钮被点击');
        isDark = !isDark;
        if (isDark) {
          html.className = 'dark';
          themeBtn.textContent = '🌙 切换到亮色模式';
        } else {
          html.className = 'light';
          themeBtn.textContent = '☀️ 切换到暗色模式';
        }
        status.textContent = '当前状态：' + (menuOpen ? '菜单打开' : '菜单关闭') + '，' + (isDark ? '暗色模式' : '亮色模式');
      };
    } else {
      console.error('未找到主题按钮');
    }
    
    // 初始化
    console.log('初始化完成');
    status.textContent = '当前状态：菜单关闭，暗色模式';
  </script>
</body>
</html>
