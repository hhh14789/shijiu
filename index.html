  <script>
    // 主题切换
    const themeBtn = document.getElementById('theme-btn');
    const moonIcon = document.getElementById('moon-icon');
    const sunIcon = document.getElementById('sun-icon');
    const html = document.documentElement;
    
    // 初始化主题
    function initTheme() {
      const saved = localStorage.getItem('theme') || 'dark';
      if (saved === 'dark') {
        html.classList.add('dark');
        html.classList.remove('light');
        moonIcon.style.display = 'block';
        sunIcon.style.display = 'none';
        document.body.style.background = '#0f172a';
        document.body.style.color = '#e2e8f0';
      } else {
        html.classList.remove('dark');
        html.classList.add('light');
        moonIcon.style.display = 'none';
        sunIcon.style.display = 'block';
        document.body.style.background = '#f8fafc';
        document.body.style.color = '#1e293b';
      }
    }
    
    initTheme();
    
    themeBtn.addEventListener('click', function() {
      const isDark = html.classList.contains('dark');
      if (isDark) {
        html.classList.remove('dark');
        html.classList.add('light');
        localStorage.setItem('theme', 'light');
        moonIcon.style.display = 'none';
        sunIcon.style.display = 'block';
        document.body.style.background = '#f8fafc';
        document.body.style.color = '#1e293b';
      } else {
        html.classList.add('dark');
        html.classList.remove('light');
        localStorage.setItem('theme', 'dark');
        moonIcon.style.display = 'block';
        sunIcon.style.display = 'none';
        document.body.style.background = '#0f172a';
        document.body.style.color = '#e2e8f0';
      }
    });
    
    // 移动菜单
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    let menuOpen = false;
    
    // 显示/隐藏汉堡按钮
    function checkMobile() {
      if (window.innerWidth < 768) {
        menuBtn.style.display = 'block';
        document.getElementById('desktop-menu').style.display = 'none';
      } else {
        menuBtn.style.display = 'none';
        document.getElementById('desktop-menu').style.display = 'flex';
        mobileMenu.style.display = 'none';
        menuOpen = false;
      }
    }
    
    checkMobile();
    window.addEventListener('resize', checkMobile);
    
    menuBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      menuOpen = !menuOpen;
      if (menuOpen) {
        mobileMenu.style.display = 'block';
        // 添加动画效果
        mobileMenu.style.animation = 'slideDown 0.3s ease';
      } else {
        mobileMenu.style.display = 'none';
      }
    });
    
    // 点击菜单项关闭菜单
    mobileMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', function() {
        mobileMenu.style.display = 'none';
        menuOpen = false;
      });
    });
    
    // 点击外部关闭菜单
    document.addEventListener('click', function(e) {
      if (!mobileMenu.contains(e.target) && !menuBtn.contains(e.target) && menuOpen) {
        mobileMenu.style.display = 'none';
        menuOpen = false;
      }
    });
    
    console.log('网站加载完成');
  </script>
