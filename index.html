<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>十九的个人世界</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { 'txt-p': '#1e293b', 'txt-light': '#64748b', 'darkmode-txt-p': '#e2e8f0', 'darkmode-txt-light': '#94a3b8' } } }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { 
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; 
      min-height: 100vh; 
      background: url('bg.jpg') center/cover fixed;
      color: #1e293b; 
      transition: background-color 0.3s ease, color 0.3s ease; 
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(248, 250, 252, 0.15);
      z-index: -2;
    }
    .dark body { 
      background: url('bg.jpg') center/cover fixed;
      color: #e2e8f0; 
    }
    .dark body::before {
      background: rgba(15, 23, 42, 0.25);
    }

    /* 流体背景 */
    .gradient-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -1;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
    }
    .blob-1 { width: 400px; height: 400px; background: linear-gradient(135deg, #e0c3fc, #8ec5fc); top: -10%; left: -5%; animation: f1 25s infinite alternate ease-in-out; }
    .blob-2 { width: 350px; height: 350px; background: linear-gradient(135deg, #ffecd2, #fcb69f); top: 50%; right: -10%; animation: f2 30s infinite alternate ease-in-out; }
    .blob-3 { width: 300px; height: 300px; background: linear-gradient(135deg, #a8edea, #fed6e3); bottom: -15%; left: 30%; animation: f3 28s infinite alternate ease-in-out; }
    .blob-4 { width: 250px; height: 250px; background: linear-gradient(135deg, #d4fc79, #96e6a1); top: 20%; left: 60%; animation: f4 22s infinite alternate ease-in-out; }
    @keyframes f1 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(50px,30px) scale(1.1)} 100%{transform:translate(20px,-20px) scale(0.9)} }
    @keyframes f2 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(-40px,-30px) scale(1.15)} 100%{transform:translate(30px,40px) scale(0.95)} }
    @keyframes f3 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(60px,-40px) scale(1.1)} 100%{transform:translate(-30px,50px) scale(0.9)} }
    @keyframes f4 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(-50px,30px) scale(1.05)} 100%{transform:translate(40px,-20px) scale(0.95)} }

    /* 透明玻璃效果 - 不是磨砂 */
    .glass {
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255,255,255,0.32);
      box-shadow: 0 0 30px rgba(255,255,255,0.12), 0 8px 32px rgba(0,0,0,0.08), inset 0 0 20px rgba(255,255,255,0.08);
      transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .dark .glass {
      background: rgba(15,23,42,0.30);
      border-color: rgba(255,255,255,0.36);
      box-shadow: 0 0 30px rgba(255,255,255,0.06), 0 8px 32px rgba(0,0,0,0.2), inset 0 0 20px rgba(255,255,255,0.04);
    }
    .glass:hover {
      background: rgba(255,255,255,0.45);
      border-color: rgba(255,255,255,0.16);
      box-shadow: 0 0 50px rgba(255,255,255,0.2), 0 0 100px rgba(255,255,255,0.1), 0 20px 60px rgba(0,0,0,0.12);
      transform: scale(1.03) translateY(-4px);
    }
    .dark .glass:hover {
      background: rgba(15,23,42,0.50);
    }

    /* 按钮透明玻璃 */
    .glass-btn {
      background: rgba(255,255,255,0.30);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      border: 1px solid rgba(255,255,255,0.32);
      box-shadow: 0 0 20px rgba(255,255,255,0.1), 0 4px 16px rgba(0,0,0,0.06);
      transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
      cursor: pointer;
    }
    .dark .glass-btn {
      background: rgba(255,255,255,0.30);
      border-color: rgba(255,255,255,0.16);
    }
    .glass-btn:hover {
      background: rgba(255,255,255,0.50);
      border-color: rgba(255,255,255,0.38);
      box-shadow: 0 0 40px rgba(255,255,255,0.2), 0 8px 24px rgba(0,0,0,0.1);
      transform: scale(1.1) translateY(-2px);
    }
    .dark .glass-btn:hover {
      background: rgba(255,255,255,0.45);
    }
    .glass-btn:active {
      transform: scale(0.95);
    }

    /* 移动菜单 */
    #menu-toggle { display: none; }
    @media (max-width: 767px) {
      #menu-toggle { display: flex !important; }
      #desktop-menu { display: none !important; }
    }
    @media (min-width: 768px) {
      #menu-toggle { display: none !important; }
      #desktop-menu { display: flex !important; }
      #mobile-menu { display: none !important; }
    }
  
    /* 导航栏毛玻璃 - 8% */
    .glass-nav {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 2px solid rgba(255,255,255,0.70);
      box-shadow: 0 0 50px rgba(255,255,255,0.34), 0 0 100px rgba(255,255,255,0.17), 0 0 150px rgba(255,255,255,0.08), 0 15px 50px rgba(0,0,0,0.08), inset 0 0 30px rgba(255,255,255,0.07);
      transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .dark .glass-nav {
      background: rgba(15,23,42,0.08);
      border-color: rgba(255,255,255,0.35);
      box-shadow: 0 0 50px rgba(255,255,255,0.23), 0 0 100px rgba(255,255,255,0.12), 0 0 150px rgba(255,255,255,0.06), 0 15px 50px rgba(0,0,0,0.18), inset 0 0 30px rgba(255,255,255,0.05);
    }
    
    /* 页脚毛玻璃 - 8% */
    .glass-footer {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 2px solid rgba(255,255,255,0.70);
      box-shadow: 0 0 50px rgba(255,255,255,0.34), 0 0 100px rgba(255,255,255,0.17), 0 0 150px rgba(255,255,255,0.08), 0 15px 50px rgba(0,0,0,0.08), inset 0 0 30px rgba(255,255,255,0.07);
      transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .dark .glass-footer {
      background: rgba(15,23,42,0.08);
      border-color: rgba(255,255,255,0.35);
      box-shadow: 0 0 50px rgba(255,255,255,0.23), 0 0 100px rgba(255,255,255,0.12), 0 0 150px rgba(255,255,255,0.06), 0 15px 50px rgba(0,0,0,0.18), inset 0 0 30px rgba(255,255,255,0.05);
    }
  
  
    .glass-nav:hover {
      background: rgba(255,255,255,0.50);
      border-color: rgba(255,255,255,0.90);
      box-shadow: 0 0 60px rgba(255,255,255,0.25), 0 0 120px rgba(255,255,255,0.12), 0 0 180px rgba(255,255,255,0.06), 0 30px 80px rgba(0,0,0,0.15);
      transform: scale(1.03) translateY(-4px);
    }
    .dark .glass-nav:hover {
      background: rgba(15,23,42,0.55);
    }

    .glass-footer:hover {
      background: rgba(255,255,255,0.55);
      border-color: rgba(255,255,255,0.90);
      box-shadow: 0 0 60px rgba(255,255,255,0.25), 0 0 120px rgba(255,255,255,0.12), 0 0 180px rgba(255,255,255,0.06), 0 30px 80px rgba(0,0,0,0.15);
      transform: scale(1.03) translateY(-4px);
    }
    .dark .glass-footer:hover {
      background: rgba(15,23,42,0.55);
    }
  </style>
</head>
<body>
  <!-- 流体背景 -->
  <div class="gradient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <!-- 导航栏 -->
  <header class="container mx-auto px-4 lg:px-8 pb-6 z-50 lg:mt-4 sticky top-0 relative">
    <nav class="relative z-50">
      <div class="glass-nav p-2 rounded-[35px]">
        <div class="min-h-12 md:min-h-14 flex flex-wrap items-center">
          <div class="order-0 flex ml-4 items-center">
            <a href="index.html" class="flex items-center">
              <img src="avatar.jpg" alt="十九" class="w-8 h-8 mx-1 rounded-full">
              <span class="text-xl font-bold">十九的个人世界</span>
            </a>
          </div>
          <div id="desktop-menu" class="hidden md:flex md:items-center md:space-x-2 md:ml-8">
            <a href="index.html" class="glass-btn px-4 py-1.5 rounded-full text-orange-500 font-semibold border-orange-400/30">首页</a>
            <a href="blog.html" class="glass-btn px-4 py-1.5 rounded-full">分享</a>
            <a href="links.html" class="glass-btn px-4 py-1.5 rounded-full">交友</a>
            <a href="about.html" class="glass-btn px-4 py-1.5 rounded-full">关于</a>
          </div>
          <div class="order-1 md:order-3 ml-auto flex items-center space-x-2 mr-4">
            <button id="menu-toggle" class="glass-btn p-2 rounded-full" onclick="toggleMenu()">
              <svg id="menu-icon-open" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
              <svg id="menu-icon-close" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <button class="glass-btn p-2 rounded-full" onclick="toggleTheme()">
              <svg id="moon-icon" class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
              <svg id="sun-icon" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            </button>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <!-- 移动菜单 -->
  <div id="menu-overlay" class="fixed inset-0 z-[9998] bg-black/30 backdrop-blur-sm hidden" onclick="closeMenu()"></div>
  <div id="mobile-menu" class="fixed top-0 right-0 z-[9999] h-full w-64 glass !rounded-l-3xl !rounded-r-none transform translate-x-full transition-transform duration-300">
    <div class="p-6">
      <div class="flex justify-between items-center mb-8">
        <h2 class="text-xl font-bold">菜单</h2>
        <button onclick="closeMenu()" class="glass-btn p-2 rounded-full">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <ul class="space-y-3">
        <li><a href="index.html" class="glass-btn block text-center py-2 rounded-full text-orange-500 font-semibold">首页</a></li>
        <li><a href="blog.html" class="glass-btn block text-center py-2 rounded-full">分享</a></li>
        <li><a href="links.html" class="glass-btn block text-center py-2 rounded-full">交友</a></li>
        <li><a href="about.html" class="glass-btn block text-center py-2 rounded-full">关于</a></li>
      </ul>
    </div>
  </div>

  <!-- 主内容 -->
  <main class="flex-1 pb-32 md:pb-36 relative z-10">
    <div class="container mx-auto px-4 lg:px-8">
      <!-- 第一行：博主信息 + 欢迎 -->
      <section class="mb-4">
        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
          <!-- 左侧博主信息 -->
          <div class="xl:col-span-1">
            <div class="glass rounded-[35px] h-full p-6">
              <div class="flex flex-col items-center space-y-4">
                <div class="relative group">
                  <div class="absolute -inset-2 bg-gradient-to-r from-orange-400 via-purple-500 to-blue-500 rounded-full blur-lg opacity-20 group-hover:opacity-40 transition-all duration-500 animate-pulse"></div>
                  <div class="absolute -inset-1 bg-gradient-to-r from-orange-400 via-purple-500 to-blue-500 rounded-full opacity-60"></div>
                  <img src="avatar.jpg" alt="十九" class="relative w-24 h-24 lg:w-28 lg:h-28 rounded-full border-2 border-white/50 shadow-2xl">
                </div>
                <div class="text-center space-y-3">
                  <h1 class="text-2xl lg:text-3xl font-bold bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 bg-clip-text text-transparent">十九</h1>
                  <div class="flex flex-wrap justify-center gap-2">
                    <span class="px-2 py-1 text-xs bg-blue-500/20 text-blue-600 dark:text-blue-400 rounded-full">学生</span>
                    <span class="px-2 py-1 text-xs bg-purple-500/20 text-purple-600 dark:text-purple-400 rounded-full">数码爱好者</span>
                    <span class="px-2 py-1 text-xs bg-green-500/20 text-green-600 dark:text-green-400 rounded-full">AI发烧友</span>
                  </div>
                  <p class="text-sm text-txt-light dark:text-darkmode-txt-light px-2">我是一名大二在校生，对数码与AI充满浓厚兴趣的发烧友，渴望学习更多知识，变得更加强大</p>
                  <div class="flex justify-center gap-3">
                    <a href="https://qm.qq.com/q/rn8I26bl8O" target="_blank" class="glass-btn p-2 rounded-full"><img src="icon1-transparent.png" alt="QQ" class="w-5 h-5 object-contain"></a>
                    <a href="mailto:3518988571@qq.com" class="glass-btn p-2 rounded-full"><img src="icon2-transparent.png" alt="邮箱" class="w-5 h-5 object-contain"></a>
                    <a href="https://space.bilibili.com/646698087" target="_blank" class="glass-btn p-2 rounded-full"><img src="icon3-transparent.png" alt="B站" class="w-5 h-5 object-contain"></a>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 右侧欢迎 -->
          <div class="xl:col-span-2">
            <div class="glass rounded-[35px] p-6">
              <h2 class="text-2xl font-bold mb-4">欢迎来到我的世界 👋</h2>
              <p class="text-txt-light dark:text-darkmode-txt-light mb-4">一个独立开发者的精神自留地，喜欢数码和研究乱七八糟的东西，平时可能会一些游戏和技术资源、产品展示，也会写写感悟随笔或者其他乱七八糟的东西。</p>
              <div class="grid grid-cols-2 gap-4">
                <div class="glass p-4 rounded-2xl text-center hover:scale-105 transition-transform"><div class="text-3xl mb-2">📦</div><h3 class="font-bold text-sm">资源分享</h3></div>
                <div class="glass p-4 rounded-2xl text-center hover:scale-105 transition-transform"><div class="text-3xl mb-2">🤖</div><h3 class="font-bold text-sm">AI探索</h3></div>
                <div class="glass p-4 rounded-2xl text-center hover:scale-105 transition-transform"><div class="text-3xl mb-2">🎁</div><h3 class="font-bold text-sm">神秘惊喜</h3></div>
                <div class="glass p-4 rounded-2xl text-center hover:scale-105 transition-transform"><div class="text-3xl mb-2">✨</div><h3 class="font-bold text-sm">更多</h3></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 第二行：最新分享 + 推荐阅读 -->
      <section class="mt-4 grid grid-cols-1 lg:grid-cols-4 gap-6 my-4">
        <div class="lg:col-span-3">
          <div class="glass rounded-2xl p-4">
            <h2 class="text-2xl font-bold mb-4">最新分享</h2>
            <div class="min-h-[200px] flex items-center justify-center">
              <div class="text-center py-8">
                <div class="text-4xl mb-3">📝</div>
                <p class="text-txt-light dark:text-darkmode-txt-light text-sm">暂无分享内容</p>
              </div>
            </div>
          </div>
        </div>
        <div class="lg:col-span-1">
          <div class="glass rounded-2xl p-4">
            <h3 class="text-xl font-bold mb-4">推荐阅读</h3>
            <div class="min-h-[150px] flex items-center justify-center">
              <div class="text-center py-4">
                <div class="text-3xl mb-2">📖</div>
                <p class="text-txt-light dark:text-darkmode-txt-light text-sm">暂无推荐阅读</p>

          </div>

    </div>
  </main>

  <!-- 页脚 -->
  <footer class="container mx-auto px-4 lg:px-8 fixed bottom-0 left-0 right-0 z-40 pointer-events-none">
    <div class="mx-auto py-2 md:py-4">
      <div class="pointer-events-auto">
        <div class="glass-footer px-6 py-2 rounded-full">
          <div class="flex items-center justify-between">
            <span class="text-sm text-txt-light dark:text-darkmode-txt-light">© 2026 十九的个人世界</span>
            <div class="flex items-center gap-3">
              <a href="https://qm.qq.com/q/rn8I26bl8O" target="_blank" class="glass-btn p-1.5 rounded-full"><img src="icon1-transparent.png" alt="QQ" class="w-4 h-4 object-contain"></a>
              <a href="mailto:3518988571@qq.com" class="glass-btn p-1.5 rounded-full"><img src="icon2-transparent.png" alt="邮箱" class="w-4 h-4 object-contain"></a>
              <a href="https://space.bilibili.com/646698087" target="_blank" class="glass-btn p-1.5 rounded-full"><img src="icon3-transparent.png" alt="B站" class="w-4 h-4 object-contain"></a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </footer>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
    const savedTheme = localStorage.getItem('theme') || 'light';
    if (savedTheme === 'dark') { document.documentElement.classList.add('dark'); }
    else { document.documentElement.classList.remove('dark'); }

    let menuOpen = false;
    function toggleMenu() {
      menuOpen = !menuOpen;
      if (menuOpen) {
        document.getElementById('mobile-menu').classList.remove('translate-x-full');
        document.getElementById('menu-overlay').classList.remove('hidden');
        document.getElementById('menu-icon-open').classList.add('hidden');
        document.getElementById('menu-icon-close').classList.remove('hidden');
      } else {
        closeMenu();
      }
    }
    function closeMenu() {
      menuOpen = false;
      document.getElementById('mobile-menu').classList.add('translate-x-full');
      document.getElementById('menu-overlay').classList.add('hidden');
      document.getElementById('menu-icon-open').classList.remove('hidden');
      document.getElementById('menu-icon-close').classList.add('hidden');
    }
  </script>
</body>
</html>
