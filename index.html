<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分享 | 十九的个人世界</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    // 主题切换
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      console.log('主题已切换为:', isDark ? '暗色模式' : '亮色模式');
    }
    
    // 初始化主题
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
    
    // 移动菜单
    let menuOpen = false;
    function toggleMenu() {
      menuOpen = !menuOpen;
      if (menuOpen) {
        document.getElementById('mobile-menu').classList.remove('translate-x-full');
        document.getElementById('menu-overlay').classList.remove('hidden');
      } else {
        closeMenu();
      }
    }
    function closeMenu() {
      menuOpen = false;
      document.getElementById('mobile-menu').classList.add('translate-x-full');
      document.getElementById('menu-overlay').classList.add('hidden');
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; background: #f8fafc; color: #1e293b; transition: background-color 0.3s ease, color 0.3s ease; }
    .dark body { background: #0f172a; color: #e2e8f0; }
    
    /* 视频背景 */
    .video-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -3; }
    .video-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(248, 250, 252, 0.15); z-index: -2; }
    .dark .video-overlay { background: rgba(15, 23, 42, 0.25); }
    
    /* 毛玻璃效果 - 调试好的数据 */
    .glass {
      background: rgba(255,255,255,0.35);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255,255,255,0.32);
      box-shadow: 0 0 30px rgba(255,255,255,0.12), 0 8px 32px rgba(0,0,0,0.08), inset 0 0 20px rgba(255,255,255,0.35);
      transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .dark .glass {
      background: rgba(15,23,42,0.35);
      border-color: rgba(255,255,255,0.16);
      box-shadow: 0 0 30px rgba(255,255,255,0.06), 0 8px 32px rgba(0,0,0,0.2), inset 0 0 20px rgba(255,255,255,0.04);
    }
    .glass:hover {
      background: rgba(255,255,255,0.55);
      border-color: rgba(255,255,255,0.50);
      box-shadow: 0 0 40px rgba(255,255,255,0.15), 0 0 80px rgba(255,255,255,0.35), 0 20px 60px rgba(0,0,0,0.12);
      transform: scale(1.03) translateY(-4px);
    }
    .dark .glass:hover { background: rgba(15,23,42,0.55); }
    
    /* 按钮样式 */
    .glass-btn {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.35) !important;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      border: 1px solid rgba(255,255,255,0.50) !important;
      box-shadow: 0 0 20px rgba(255,255,255,0.1), 0 4px 16px rgba(0,0,0,0.06);
      transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
      cursor: pointer !important;
      text-decoration: none !important;
      color: inherit !important;
      padding: 0.5rem 1rem;
      border-radius: 12px;
      pointer-events: auto !important;
      z-index: 100;
      position: relative;
    }
    
    .dark 
    
    .glass-btn:hover {
      background: rgba(255,255,255,0.55) !important;
      border-color: rgba(255,255,255,0.70) !important;
      box-shadow: 0 0 40px rgba(255,255,255,0.2), 0 8px 24px rgba(0,0,0,0.1);
      transform: scale(1.05) translateY(-2px);
    }
    
    .dark 
    
    .glass-btn:active {
      transform: scale(0.95);
    }
    
    /* 确保按钮可点击 */
    button, a {
      pointer-events: auto !important;
      cursor: pointer !important;
    }
    
    #menu-toggle { display: none; }
    @media (max-width: 767px) { #menu-toggle { display: flex !important; } #desktop-menu { display: none !important; } }
    @media (min-width: 768px) { #menu-toggle { display: none !important; } #desktop-menu { display: flex !important; } #mobile-menu { display: none !important; } }
    
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  
    /* 导航栏 - 8%透明度 */
    .glass-nav {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 2px solid rgba(255,255,255,0.70);
      box-shadow: 0 0 50px rgba(255,255,255,0.34), 0 0 100px rgba(255,255,255,0.17), 0 0 150px rgba(255,255,255,0.08), 0 15px 50px rgba(0,0,0,0.08), inset 0 0 30px rgba(255,255,255,0.07);
      transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .dark .glass-nav {
      background: rgba(15,23,42,0.08);
      border-color: rgba(255,255,255,0.35);
      box-shadow: 0 0 50px rgba(255,255,255,0.23), 0 0 100px rgba(255,255,255,0.12), 0 0 150px rgba(255,255,255,0.06), 0 15px 50px rgba(0,0,0,0.22), inset 0 0 30px rgba(255,255,255,0.05);
    }
    
    /* 页脚 - 8%透明度 */
    .glass-footer {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 2px solid rgba(255,255,255,0.70);
      box-shadow: 0 0 50px rgba(255,255,255,0.34), 0 0 100px rgba(255,255,255,0.17), 0 0 150px rgba(255,255,255,0.08), 0 15px 50px rgba(0,0,0,0.08), inset 0 0 30px rgba(255,255,255,0.07);
      transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .dark .glass-footer {
      background: rgba(15,23,42,0.08);
      border-color: rgba(255,255,255,0.35);
      box-shadow: 0 0 50px rgba(255,255,255,0.23), 0 0 100px rgba(255,255,255,0.12), 0 0 150px rgba(255,255,255,0.06), 0 15px 50px rgba(0,0,0,0.22), inset 0 0 30px rgba(255,255,255,0.05);
    }
  
    .glass-nav:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.90);
      box-shadow: 0 0 60px rgba(255,255,255,0.45), 0 0 120px rgba(255,255,255,0.23), 0 0 180px rgba(255,255,255,0.11), 0 30px 80px rgba(0,0,0,0.10);

    }
    .dark .glass-footer:hover {
      background: rgba(15,23,42,0.15);
    }
  
    /* 导航按钮选中状态 - 只有字体变橙色 */
    .glass-btn.active,
    .glass-btn[aria-current="page"] {
      color: rgb(249, 115, 22) !important;
    }
  </style>
