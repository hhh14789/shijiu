<!DOCTYPE html>

<body class="min-h-screen">

  </div>

        <div class="liquidGlass-text min-h-12 md:min-h-14 flex flex-wrap items-center">

                      <div class="flex items-center gap-4 mt-3">

                        <button class="text-xs text-gray-400 hover:text-orange-500 transition-colors">💬 回复</button>
                      </div>
                    </div>

                    </div>

                <!-- 评论3 -->

                  <div class="flex-shrink-0">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-r from-pink-400 to-red-500 flex items-center justify-center text-white font-bold">C</div>
                  </div>
                  <div class="flex-1">
                    <div class="bg-white/40 dark:bg-white/10 rounded-2xl p-4 backdrop-blur-sm border border-white/20 dark:border-white/10">

                      </div>

                      <div class="flex items-center gap-4 mt-3">
                        <button class="text-xs text-gray-400 hover:text-orange-500 transition-colors">👍 15</button>

                      </div>

                    <!-- 回复 -->

                          <div class="w-8 h-8 rounded-full bg-gradient-to-r from-orange-400 to-pink-500 flex items-center justify-center text-white font-bold text-xs">主</div>
                        </div>
                        <div class="flex-1">
                          <div class="bg-white/30 dark:bg-white/5 rounded-xl p-3 backdrop-blur-sm border border-white/15 dark:border-white/5">
                            <div class="flex items-center gap-2 mb-1">
                              <span class="font-bold text-xs text-txt-p dark:text-darkmode-txt-p">十九</span>
                              <span class="text-xs text-gray-400">2026-07-04 18:30</span>
                            </div>
                            <p class="text-txt-light dark:text-darkmode-txt-light text-xs">用CSS的filter: blur()和渐变实现的，后面可以写篇教程分享一下！</p>

                  <a href="mailto:3518988571@qq.com" class="glass-button glass-button--icon p-1.5 rounded-full"><img src="icon2-transparent.png" alt="邮箱" class="w-4 h-4 object-contain"></a>
